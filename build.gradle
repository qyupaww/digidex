// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        // Dinaikkan ke versi stabil yang mendukung Gradle modern
        compose_version = '1.5.4'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 1. Naikkan AGP ke 8.2.0 (Sesuai dengan Gradle 8.5)
        classpath 'com.android.tools.build:gradle:8.2.0'

        // 2. Naikkan Kotlin ke 1.9.22 (Wajib naik agar support Java 17 & Gradle 8)
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"

        // 3. Naikkan Hilt ke 2.50 (Agar support Kotlin modern dan tidak crash saat compile)
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.50'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}